name: Godot 4.4.1 complete-project verification

on:
  push:
    branches: [main, fix/restore-storybook-adventure]
  pull_request:
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download the documented Godot version
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -j /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and run all seven regression suites
        run: python3 tools/verify.py --godot /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64
      - name: Verify adventure navigation and capture native screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb
          set -o pipefail
          xvfb-run -a /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --audio-driver Dummy --path . --fixed-fps 60 res://tests/restoration_review.tscn -- --screenshots 2>&1 | tee test_output/native_restoration.log
          if grep -E 'SCRIPT ERROR:|^ERROR:|FAIL:' test_output/native_restoration.log; then exit 1; fi
      - name: Package playable Godot source
        run: |
          mkdir -p dist/Mark-and-Bark-3.2.1-Storybook-Restoration
          rsync -a --exclude=.git --exclude=.godot --exclude=dist --exclude=test_output ./ dist/Mark-and-Bark-3.2.1-Storybook-Restoration/
          cd dist
          zip -qr Mark-and-Bark-3.2.1-Storybook-Restoration.zip Mark-and-Bark-3.2.1-Storybook-Restoration
      - name: Upload playable source
        uses: actions/upload-artifact@v4
        with:
          name: Mark-and-Bark-3.2.1-Storybook-Restoration
          path: dist/Mark-and-Bark-3.2.1-Storybook-Restoration.zip
          if-no-files-found: error
      - name: Upload logs and screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Godot-validation-and-visuals
          path: |
            test_output/qa_*.log
            test_output/qa_summary.json
            test_output/native_restoration.log
            test_output/restoration_*.png
          if-no-files-found: ignore
